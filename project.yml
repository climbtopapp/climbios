name: Climb
options:
  bundleIdPrefix: com.climb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
targets:
  Climb:
    type: application
    platform: iOS
    sources:
      - path: Climb/Sources
      - path: Climb/Resources
      - path: Climb/Assets.xcassets
      - path: Climb/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: climb.adamtampio.app
        PRODUCT_NAME: "Climb: Vote on Vibes"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Climb/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XHNAVCGKFP
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - package: Supabase
        product: Supabase
schemes:
  Climb:
    build:
      targets:
        Climb: all
    run:
      config: Debug
      storekitConfiguration: Climb/Climb.storekit

