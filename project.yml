name: Climb
options:
  bundleIdPrefix: com.climb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
targets:
  Climb:
    type: application
    platform: iOS
    sources:
      - path: Climb/Sources
      - path: Climb/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.climb.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Climb/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - package: Supabase
        product: Supabase
    resources:
      - path: Climb/Assets.xcassets
      - path: Climb/Resources/Fonts
        buildPhase: resources
